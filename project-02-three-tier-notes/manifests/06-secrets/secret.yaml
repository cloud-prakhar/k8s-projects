# 06-secrets/secret.yaml
# 🧪 DEMO / LEARNING CONFIGURATION — this file is committed to Git with a
#    readable database password in it. NEVER do this outside a lab. See §11 of
#    the stage README for what production does instead.
#
# WHY: the database password must not sit in the ConfigMap next to LOG_LEVEL.
#      Secrets are a distinct kind so they can be handled differently: separate
#      RBAC rules, kept out of `describe` output, optionally encrypted at rest
#      in etcd, and held in tmpfs (memory, not disk) when mounted as a volume.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: notes-platform
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/instance: postgres-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: notes-platform
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "PostgreSQL superuser password, consumed by the database and the API"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref,base64-is-not-encryption"
type: Opaque   # generic key/value. Other types: kubernetes.io/tls, /dockerconfigjson, /basic-auth
# `stringData` takes plain text and the API server base64-encodes it for you.
# Use it in hand-written manifests — far less error-prone than base64-ing values
# yourself, and exactly as (in)secure. Base64 is ENCODING, NOT ENCRYPTION:
# anyone who can read this object can read the password.
#
# ONE key, consumed by TWO workloads: Postgres uses it to CREATE the superuser
# on first initialisation, and notes-api uses it to CONNECT. If they ever
# disagree, the API gets "password authentication failed" while both pods look
# perfectly healthy.
stringData:
  POSTGRES_PASSWORD: "dev-password-not-for-production"
