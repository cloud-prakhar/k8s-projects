# 06-secrets/postgres-deployment.yaml
# WHAT CHANGED vs 05-configmaps/postgres-deployment.yaml:
#   POSTGRES_PASSWORD is no longer a literal. It is read from a Secret, which is
#   a different KIND of object with different handling — not merely a ConfigMap
#   with a scarier name.
#
# Nothing else moved. Non-confidential settings stay in the ConfigMap; that
# split is the whole point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: notes-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: notes-platform
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL — password from a Secret, still no volume"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: notes-platform
        app.kubernetes.io/version: "17.5"
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # configMapKeyRef = ONE named key becomes ONE named variable.
            # Explicit, greppable, and it fails loudly if the key is missing.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: POSTGRES_USER
            # secretKeyRef looks identical to configMapKeyRef on purpose — the
            # consumption API is the same. What differs is everything around
            # the object: RBAC, describe output, encryption-at-rest, tmpfs.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # subPath mounts ONE key as ONE file, leaving the rest of the target
            # directory alone. Without it, mounting at /docker-entrypoint-initdb.d
            # would replace the whole directory with the ConfigMap's contents.
            #
            # ⚠️ The trade-off: subPath mounts are NOT refreshed by the kubelet
            #    when the ConfigMap changes. A whole-directory ConfigMap mount is
            #    updated (~60s); a subPath mount is frozen for the pod's life.
            #    For an init script that runs exactly once, that is irrelevant.
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/10-init.sql
              subPath: init.sql
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
            # 0o444 — read-only for everyone. The entrypoint only needs to read it.
            defaultMode: 0444
