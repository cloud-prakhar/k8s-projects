# 11-health-checks/notes-web-deployment.yaml
# WHAT CHANGED vs 05-configmaps/notes-web-deployment.yaml:
#   Startup, readiness and liveness probes.
#
# ⚠️ Note what this tier's /healthz does NOT do: it does not call the API.
#    Chaining readiness to a dependency propagates one outage upward through
#    every tier until nothing in the cluster has any endpoints. A tier is
#    "ready" when IT can serve; reporting a broken dependency is the job of a
#    502 with a clear message, which is exactly what this app returns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-web
  namespace: notes-platform
  labels:
    app.kubernetes.io/name: notes-web
    app.kubernetes.io/instance: notes-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: notes-platform
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Notes web UI — health-probed, zero-downtime rollouts"
    lab.k8s-project/stage: "11-health-checks"
    lab.k8s-project/teaches: "readiness,liveness,startup-probe"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-web
      app.kubernetes.io/instance: notes-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-web
        app.kubernetes.io/instance: notes-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: notes-platform
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: notes-web
          image: notes-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Named keys rather than envFrom: this tier only needs two settings,
            # and the database credentials have no business being in its
            # environment at all. Give each container the smallest env you can.
            - name: NOTES_API_URL
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: NOTES_API_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: APP_ENV
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 1
            failureThreshold: 30

          # maxUnavailable: 0 above is only MEANINGFUL because this probe
          # exists. Without a readiness probe a pod counts as "available" the
          # instant it is Running, so the rollout advances before the new pod
          # can serve anything — and users get 502s during every deploy.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
