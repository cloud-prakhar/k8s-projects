# 11-health-checks/postgres-statefulset.yaml
# WHAT CHANGED vs 08-statefulsets/02-postgres-statefulset.yaml:
#   exec probes using pg_isready. This is the final version of the database.
#
# WHY exec and not httpGet: PostgreSQL speaks its own wire protocol, not HTTP.
# There is nothing to GET. `exec` runs a command INSIDE the container and reads
# its exit code — the escape hatch for anything that is not an HTTP service.
# It is also the most expensive probe type: it forks a process every period, so
# do not run one every second against a busy database.
#
# Recap of what the StatefulSet itself gives you (stage 08), because this file
# is the one you will read when operating the platform:
#   • a stable ORDINAL NAME          postgres-0, postgres-1, …
#   • a stable DNS NAME              postgres-0.postgres-headless.…
#   • its OWN PersistentVolumeClaim  postgres-data-postgres-0, …
#   • ordered, one-at-a-time start-up, shutdown and rolling updates
#
# None of which a Deployment can do, because a Deployment has one pod template
# naming one claim — so every replica would share a volume that permits one
# writer.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: notes-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: notes-platform
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL StatefulSet — stable identity, per-pod volume, health-probed"
    lab.k8s-project/stage: "11-health-checks"
    lab.k8s-project/teaches: "exec-probes,pg_isready,readiness-gates-endpoints"
spec:
  # The headless Service that owns the per-pod DNS names. This field is NOT
  # optional and NOT automatic: name a Service that does not exist and the pods
  # still start, but `postgres-0.postgres-headless…` never resolves.
  serviceName: postgres-headless
  # Still ONE replica. A second replica would be a second, EMPTY database with
  # its own volume — not a replica of the first. PostgreSQL replication is
  # configured inside PostgreSQL (primary/standby, WAL streaming); Kubernetes
  # only supplies identity and storage. Project 03 scales a StatefulSet whose
  # software CAN cluster (Redis); the honest answer for Postgres in production
  # is an operator such as CloudNativePG.
  replicas: 1
  revisionHistoryLimit: 5
  # Like a Deployment's, this selector is IMMUTABLE. Keep it minimal.
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  # OrderedReady: pods are created 0,1,2… and each must be Running AND Ready
  # before the next begins; on scale-down they are removed in reverse. The
  # alternative, `Parallel`, starts them all at once — right for members that do
  # not need to bootstrap from each other.
  podManagementPolicy: OrderedReady
  updateStrategy:
    # RollingUpdate on a StatefulSet walks from the HIGHEST ordinal down, one
    # pod at a time, waiting for Ready. `partition: N` updates only ordinals
    # ≥ N, which is how canary upgrades of stateful systems are done.
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: notes-platform
        app.kubernetes.io/version: "17.5"
    spec:
      # Give Postgres time to finish a clean shutdown before SIGKILL. The
      # default 30s is usually enough for a small database; a large one needs
      # more, and killing it mid-checkpoint means crash recovery on next boot.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # STARTUP: first initialisation of an empty data directory runs initdb
          # and the seed script, which takes far longer than a normal boot.
          # Budget = 30 × 5s = 150s before the liveness probe is allowed to act.
          #
          # ⚠️ -h 127.0.0.1 is not decoration. During initdb, PostgreSQL runs a
          #    TEMPORARY server that listens on a unix socket ONLY. A pg_isready
          #    without -h talks to that socket, reports "accepting connections"
          #    while the database is still being built, and the pod is declared
          #    Ready far too early. Forcing TCP tests the port real clients use.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          # READINESS: while this fails, the postgres pod is removed from the
          # Service's EndpointSlice, so notes-api gets a fast connection error
          # instead of a hanging socket. Nothing is restarted.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # LIVENESS: deliberately slack. Restarting a database is a serious
          # act — it means crash recovery on the next boot. Only kill it when it
          # has genuinely stopped answering for a full minute
          # (6 × 10s = 60s), never on a single slow response.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            # The name matches the volumeClaimTemplate below, NOT a volume in a
            # `volumes:` list. There is no `volumes:` entry for it at all.
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/10-init.sql
              subPath: init.sql
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
            defaultMode: 0444
  # THE feature that separates a StatefulSet from a Deployment. This is a
  # TEMPLATE: the controller stamps out one real PVC per pod, named
  # <template-name>-<statefulset-name>-<ordinal> → postgres-data-postgres-0.
  #
  # ⚠️ Those PVCs are NOT garbage-collected when the StatefulSet is deleted.
  #    That is deliberate — deleting a workload should not destroy its data —
  #    and it is why `kubectl delete statefulset` followed by `kubectl get pvc`
  #    surprises people. Recreate the StatefulSet and pod 0 reattaches to its
  #    old volume, data intact.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: notes-platform
        annotations:
          kubernetes.io/description: "Per-pod durable storage for the PostgreSQL data directory"
      spec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
