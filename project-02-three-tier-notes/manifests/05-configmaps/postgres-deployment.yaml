# 05-configmaps/postgres-deployment.yaml
# WHAT CHANGED vs 03-deployments/postgres-deployment.yaml:
#   1. POSTGRES_DB / POSTGRES_USER now come from the ConfigMap by KEY REFERENCE
#      (one explicit variable each) instead of being literals.
#   2. The seed schema is MOUNTED AS A FILE from a second ConfigMap.
#
# The password is still a plaintext literal. That is the last thing left to fix,
# and it is stage 06.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: notes-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: notes-platform
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL — configured from ConfigMaps, still no volume"
    lab.k8s-project/stage: "05-configmaps"
    lab.k8s-project/teaches: "configmapkeyref,configmap-as-volume,subpath"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: notes-platform
        app.kubernetes.io/version: "17.5"
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # configMapKeyRef = ONE named key becomes ONE named variable.
            # Explicit, greppable, and it fails loudly if the key is missing.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: notes-config
                  key: POSTGRES_USER
            # ⚠️ STILL PLAINTEXT — stage 06.
            - name: POSTGRES_PASSWORD
              value: "devpassword"
          volumeMounts:
            # subPath mounts ONE key as ONE file, leaving the rest of the target
            # directory alone. Without it, mounting at /docker-entrypoint-initdb.d
            # would replace the whole directory with the ConfigMap's contents.
            #
            # ⚠️ The trade-off: subPath mounts are NOT refreshed by the kubelet
            #    when the ConfigMap changes. A whole-directory ConfigMap mount is
            #    updated (~60s); a subPath mount is frozen for the pod's life.
            #    For an init script that runs exactly once, that is irrelevant.
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/10-init.sql
              subPath: init.sql
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
            # 0o444 — read-only for everyone. The entrypoint only needs to read it.
            defaultMode: 0444
