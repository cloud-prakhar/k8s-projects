# --- NetworkPolicies (stage 15) --------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: default-deny-all
    app.kubernetes.io/instance: default-deny-all
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Isolate every pod in the namespace for ingress and egress; allow rules follow"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,default-deny"
spec:
  podSelector: {}            # every pod in `ecommerce`
  policyTypes:
    - Ingress
    - Egress
  # no ingress:/egress: rules at all ⇒ nothing is allowed in either direction
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-dns-egress
    app.kubernetes.io/instance: allow-dns-egress
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Allow every pod in the namespace to query CoreDNS in kube-system on port 53"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,dns-egress"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        # ONE list item with BOTH selectors = AND: pods labelled k8s-app=kube-dns
        # that are ALSO in kube-system. Two separate `- ` items would be OR —
        # "any pod in kube-system" OR "any kube-dns pod in THIS namespace".
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-to-public-services
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-internet-to-public-services
    app.kubernetes.io/instance: allow-internet-to-public-services
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Admit port 8080 to the four ALB-exposed services from any source"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,ingress,ipblock"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [storefront, catalog, cart, order]     # NOT payment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
