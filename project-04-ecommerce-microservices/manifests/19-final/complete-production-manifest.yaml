# 19-final/complete-production-manifest.yaml
# ---------------------------------------------------------------------------
# THE COMPLETE DESIRED STATE of Project 04, in one file — plus the ConfigMap
# that kustomization.yaml GENERATES from config/ecommerce.env.
#
# ⚠️ Apply it through Kustomize:  kubectl apply -k manifests/19-final/
#    Applied with -f alone, every Deployment references `ecommerce-config`,
#    which does not exist, and pods sit in CreateContainerConfigError.
#
# Every object below is the FINAL version from its teaching stage, copied
# verbatim by a script — so this file cannot drift from the stages:
#   namespace (11) · StorageClass (07) · Secrets (06) · postgres-init (03)
#   Services (04, 08) · StatefulSets (11) · Deployments (11) · Ingress (09)
#   NetworkPolicies (15)
#
# DELIBERATELY ABSENT (teaching artifacts): the hand-written mutable
# ecommerce-config, the stand-alone postgres-data / redis-data PVCs, and the
# Deployment versions of both datastores.
#
# PREREQUISITES (cluster software, not this application) — clusters/eks-advanced.yaml:
#   • VPC CNI with enableNetworkPolicy: "true"  — or the policies do nothing
#   • aws-ebs-csi-driver                         — or no PVC ever binds
#   • AWS Load Balancer Controller + IngressClass alb — or no ALB appears
# ---------------------------------------------------------------------------
# --- Namespace -----------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  annotations:
    kubernetes.io/description: "E-commerce microservices — storefront, catalog, cart, order, payment, PostgreSQL and Redis"
    lab.k8s-project/stage: "11-health-checks"
    lab.k8s-project/teaches: "namespace,alb-readiness-gate"
---
# --- Storage (cluster-scoped) ----------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ecommerce-gp3
  labels:
    app.kubernetes.io/name: ecommerce-gp3
    app.kubernetes.io/instance: ecommerce-gp3
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Encrypted gp3 EBS volumes for the shop's datastores"
    lab.k8s-project/stage: "07-storage"
    lab.k8s-project/teaches: "storageclass,ebs-csi,waitforfirstconsumer"
provisioner: ebs.csi.aws.com          # the EBS CSI driver add-on
parameters:
  type: gp3
  encrypted: "true"                   # parameters are strings — quote them
reclaimPolicy: Delete                 # 🧪 lab: deleting the claim deletes the EBS volume
# Create the volume only once a pod needs it, IN THAT POD'S AZ. EBS is zonal:
# `Immediate` would pick an AZ at random and could strand the pod.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# --- Secrets — 🧪 in Git for the lab only -----------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/instance: postgres-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL password — shared by postgres, catalog and order"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref,base64-is-not-encryption"
type: Opaque
# stringData: you write plain text; the API server base64-encodes it into `data`.
stringData:
  POSTGRES_PASSWORD: "dev-password-not-for-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis-secret
    app.kubernetes.io/instance: redis-secret
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "Redis password — shared by redis and cart"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref"
type: Opaque
stringData:
  REDIS_PASSWORD: "dev-redis-password-not-for-production"
---
# --- PostgreSQL init script (runs once, at first initdb) -------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres-init
    app.kubernetes.io/instance: postgres-init
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "Creates the second database (orders) at first PostgreSQL initialisation"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "configmap-as-file,docker-entrypoint-initdb"
data:
  # The filename becomes the key; the key becomes the filename in the mount.
  01-create-orders-db.sql: |
    -- `catalog` already exists: the image created it from POSTGRES_DB.
    -- `order` owns its own database inside the same server. Separate databases
    -- mean neither service can accidentally read or migrate the other's tables,
    -- which keeps the ownership story honest even though they share a server.
    CREATE DATABASE orders OWNER ecommerce;
---
