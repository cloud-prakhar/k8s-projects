# --- Headless governing Services (stage 08) --------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Headless governing Service for StatefulSet/postgres — per-pod DNS"
    lab.k8s-project/stage: "08-statefulsets"
    lab.k8s-project/teaches: "headless-service,per-pod-dns"
spec:
  clusterIP: None                     # ← headless: no VIP, no kube-proxy rules
  # Publish pods before they are Ready, so a member's own name resolves during
  # start-up (replication and init scripts often need it).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Headless governing Service for StatefulSet/redis — per-pod DNS"
    lab.k8s-project/stage: "08-statefulsets"
    lab.k8s-project/teaches: "headless-service,per-pod-dns"
spec:
  clusterIP: None                     # ← headless: no VIP, no kube-proxy rules
  # Publish pods before they are Ready, so a member's own name resolves during
  # start-up (replication and init scripts often need it).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# --- Datastores (StatefulSets with probes, stage 11) -----------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: '17.5'
  annotations:
    kubernetes.io/description: PostgreSQL holding the catalog and orders databases
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: exec-probes,startup-probe
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: '17.5'
    spec:
      containers:
      - name: postgres
        image: postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: ecommerce
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: catalog
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
        startupProbe:
          exec: &id001
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U ecommerce -d catalog
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/part-of: ecommerce
    spec:
      storageClassName: ecommerce-gp3
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: 8.2.9
  annotations:
    kubernetes.io/description: Redis holding session baskets with a TTL
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: exec-probes
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: 8.2.9
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: redis
        image: redis:8.2.9-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - |
          printf 'requirepass %s\nappendonly yes\ndir /data\n' "$REDIS_PASSWORD" > /run/redis/redis.conf
          exec redis-server /run/redis/redis.conf
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: rendered-config
          mountPath: /run/redis
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
        startupProbe:
          exec: &id001
            command:
            - sh
            - -c
            - redis-cli ping | grep -q PONG
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
      volumes:
      - name: rendered-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/part-of: ecommerce
    spec:
      storageClassName: ecommerce-gp3
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
