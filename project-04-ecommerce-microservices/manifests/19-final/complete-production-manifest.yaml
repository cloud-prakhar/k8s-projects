    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: probes,rolling-update,readiness-gate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
      app.kubernetes.io/instance: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/instance: storefront
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
      - name: storefront
        image: cloudprakhargupta/ecommerce:storefront-1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
