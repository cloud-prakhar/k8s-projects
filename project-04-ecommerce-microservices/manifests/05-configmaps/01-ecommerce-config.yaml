# 05-configmaps/01-ecommerce-config.yaml
# WHY: After stage 04 the same values are copied across several manifests:
#      POSTGRES_HOST in two Deployments, the service URLs in two more,
#      UPSTREAM_TIMEOUT_SECONDS in two. Changing one means finding every copy,
#      and missing one means two services disagree with no error anywhere.
#
# THIS CONFIGMAP HOLDS ONLY *SHARED* CONFIGURATION — the values every service
# must agree on. Look at what is deliberately ABSENT:
#
#   POSTGRES_DB  — `catalog` and `orders`. OWNED config: each service has its
#                  own answer, and putting it here would force them to share a
#                  database, silently erasing the ownership boundary.
#   passwords    — credentials belong in a Secret (stage 06).
#
# That split — shared vs owned vs secret — is the whole lesson of this stage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-config
    app.kubernetes.io/instance: ecommerce-config
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shared configuration every service agrees on — hostnames, ports and timeouts"
    lab.k8s-project/stage: "05-configmaps"
    lab.k8s-project/teaches: "configmap,envfrom,shared-vs-owned-config"
data:
  # --- where the datastores are (shared: one host, one port) ----------------
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "ecommerce"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # --- where the services are (shared: everyone uses the same names) --------
  CATALOG_URL: "http://catalog:8080"
  CART_URL: "http://cart:8080"
  ORDER_URL: "http://order:8080"
  PAYMENT_URL: "http://payment:8080"

  # --- behaviour every service must agree on --------------------------------
  # How long any service waits on an upstream before giving up. The single most
  # important value in this file: without a bound, one slow service makes every
  # caller slow, and the whole site degrades from one late dependency.
  UPSTREAM_TIMEOUT_SECONDS: "3"
  # How long an idle basket survives. Every write refreshes it.
  CART_TTL_SECONDS: "1800"

  # --- the failure dials (stage 11 and the failure labs turn these up) ------
  # Values are ALWAYS strings in a ConfigMap. `0` unquoted is a YAML integer and
  # the API server rejects it: "cannot unmarshal number into Go value of type
  # string". Quote everything.
  PAYMENT_LATENCY_MS: "0"
  PAYMENT_FAIL_RATE: "0"
