# 05-configmaps/04-cart-deployment.yaml
# WHAT CHANGED from 03-deployments/cart-deployment.yaml:
#   REDIS_HOST, REDIS_PORT and CART_TTL_SECONDS now come from the ConfigMap.
#   REDIS_PASSWORD is still a literal — stage 06 moves it to a Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: cart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Session baskets in Redis — the only service permitted to reach Redis"
    lab.k8s-project/stage: "05-configmaps"
    lab.k8s-project/teaches: "envfrom,configmap"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      app.kubernetes.io/instance: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/instance: cart
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: cart
          image: cloudprakhargupta/ecommerce:cart-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: REDIS_PASSWORD
              value: "dev-redis-password-not-for-production"   # ⚠️ stage 06
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
