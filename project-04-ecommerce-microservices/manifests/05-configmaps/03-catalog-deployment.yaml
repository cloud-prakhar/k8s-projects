# 05-configmaps/03-catalog-deployment.yaml
# WHAT CHANGED from 03-deployments/catalog-deployment.yaml:
#   POSTGRES_HOST / POSTGRES_PORT / POSTGRES_USER now come from the ConfigMap.
#
# WHAT DELIBERATELY DID NOT CHANGE:
#   POSTGRES_DB stays here, as a literal. It is `catalog` for this service and
#   `orders` for the order service — OWNED configuration, not shared. Move it
#   into the ConfigMap and both services would be forced onto one database,
#   erasing the ownership boundary with no error anywhere.
#
#   POSTGRES_PASSWORD is still plaintext. Stage 06 fixes that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Product catalogue — owns the catalog database"
    lab.k8s-project/stage: "05-configmaps"
    lab.k8s-project/teaches: "envfrom,shared-vs-owned-config"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: catalog
          image: cloudprakhargupta/ecommerce:catalog-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            # --- OWNED: this service's database, nobody else's ---------------
            - name: POSTGRES_DB
              value: "catalog"
            # An explicit `env` entry BEATS the same key from `envFrom`. That
            # precedence is what lets owned config override shared config.
            - name: POSTGRES_PASSWORD
              value: "dev-password-not-for-production"   # ⚠️ stage 06 fixes this
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
