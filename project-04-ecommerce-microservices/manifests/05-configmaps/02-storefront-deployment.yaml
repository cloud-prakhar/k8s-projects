# 05-configmaps/02-storefront-deployment.yaml
# WHAT CHANGED from 03-deployments/storefront-deployment.yaml:
#   the four literal env values (CATALOG_URL, CART_URL, ORDER_URL,
#   UPSTREAM_TIMEOUT_SECONDS) are gone, replaced by ONE envFrom reference.
#
# The image is byte-identical. Only the environment moved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/instance: storefront
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shop UI — fans out to catalog, cart and order"
    lab.k8s-project/stage: "05-configmaps"
    lab.k8s-project/teaches: "envfrom,configmap"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
      app.kubernetes.io/instance: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/instance: storefront
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: storefront
          image: cloudprakhargupta/ecommerce:storefront-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Inject EVERY key in the ConfigMap as an environment variable.
          #
          # ⚠️ envFrom is all-or-nothing: this pod also receives POSTGRES_HOST
          #    and PAYMENT_URL, which the storefront never reads. Harmless, but
          #    be deliberate — use `configMapKeyRef` per variable when a service
          #    should only see what it needs.
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            # OWNED config stays here: the pod's own identity.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
