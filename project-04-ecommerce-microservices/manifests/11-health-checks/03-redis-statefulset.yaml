# 11-health-checks/03-redis-statefulset.yaml
# WHAT CHANGED from 08-statefulsets: probes. `redis-cli ping` authenticates via
# REDISCLI_AUTH (from the Secret) — without it every probe fails with NOAUTH and
# the pod never becomes Ready.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: 8.2.9
  annotations:
    kubernetes.io/description: Redis holding session baskets with a TTL
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: exec-probes
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: 8.2.9
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: redis
        image: redis:8.2.9-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - |
          printf 'requirepass %s\nappendonly yes\ndir /data\n' "$REDIS_PASSWORD" > /run/redis/redis.conf
          exec redis-server /run/redis/redis.conf
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: rendered-config
          mountPath: /run/redis
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
        startupProbe:
          exec: &id001
            command:
            - sh
            - -c
            - redis-cli ping | grep -q PONG
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
      volumes:
      - name: rendered-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/part-of: ecommerce
    spec:
      storageClassName: ecommerce-gp3
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
