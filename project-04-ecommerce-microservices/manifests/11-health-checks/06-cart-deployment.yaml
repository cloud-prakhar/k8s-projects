# 11-health-checks/06-cart-deployment.yaml
# WHAT CHANGED: startup / readiness / liveness probes, and a rolling update that
# never drops below the desired ready count (maxUnavailable: 0).
#
#   liveness  = /livez   — the PROCESS only. Never a dependency: a database blip
#                          must not restart every pod at once.
#   readiness = Redis reachable. Redis IS the cart, so a cart pod without it should leave the ALB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: cart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: "Session baskets in Redis \u2014 the only service permitted to reach Redis"
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: probes,rolling-update,readiness-gate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      app.kubernetes.io/instance: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/instance: cart
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
      - name: cart
        image: cloudprakhargupta/ecommerce:cart-1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
