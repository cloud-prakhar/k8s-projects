# 11-health-checks/05-catalog-deployment.yaml
# WHAT CHANGED: startup / readiness / liveness probes, and a rolling update that
# never drops below the desired ready count (maxUnavailable: 0).
#
#   liveness  = /livez   — the PROCESS only. Never a dependency: a database blip
#                          must not restart every pod at once.
#   readiness = PostgreSQL reachable (a hard dependency). The schema is created by an init container.
#
# INIT CONTAINER `migrate`: the SAME image runs `python migrate.py` to completion
# BEFORE the app container starts; exit 0 lets it start, anything else shows as
# Init:Error. RUN_MIGRATIONS=false stops the app migrating from inside itself.
# Init containers run once PER POD — two replicas still race; the PostgreSQL
# advisory lock in migrations.py is what makes that safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: "Product catalogue \u2014 owns the catalog database"
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: probes,rolling-update,readiness-gate,init-container
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
      - name: catalog
        image: cloudprakhargupta/ecommerce:catalog-1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: RUN_MIGRATIONS
          value: 'false'
        - name: POSTGRES_DB
          value: catalog
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
      initContainers:
      - name: migrate
        image: cloudprakhargupta/ecommerce:catalog-1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - migrate.py
        envFrom:
        - configMapRef:
            name: ecommerce-config
        env:
        - name: POSTGRES_DB
          value: catalog
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
