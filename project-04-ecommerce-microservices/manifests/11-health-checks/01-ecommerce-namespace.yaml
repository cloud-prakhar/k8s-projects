# 11-health-checks/01-ecommerce-namespace.yaml
# WHAT CHANGED from 00-namespace/namespace.yaml: one label.
#
#   elbv2.k8s.aws/pod-readiness-gate-inject: enabled
#
# The AWS Load Balancer Controller's webhook adds a readinessGate to every NEW
# pod in a namespace carrying this label. Such a pod is not Ready — and so a
# rollout will not delete an old pod — until the ALB itself reports the pod's
# target HEALTHY. Kubelet readiness and ALB health become one condition.
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  annotations:
    kubernetes.io/description: "E-commerce microservices — storefront, catalog, cart, order, payment, PostgreSQL and Redis"
    lab.k8s-project/stage: "11-health-checks"
    lab.k8s-project/teaches: "namespace,alb-readiness-gate"
