# 11-health-checks/02-postgres-statefulset.yaml
# WHAT CHANGED from 08-statefulsets: startup, readiness and liveness probes.
#
# `exec` probes, not HTTP: PostgreSQL speaks its own protocol. pg_isready asks
# the server whether it accepts connections. `-h 127.0.0.1` forces a TCP check;
# without it pg_isready tests a Unix socket path instead.
#
#   startup   60 × 2s  — up to two minutes for first-time initdb on a new volume
#   readiness  3 × 5s  — out of Service endpoints after ~15 s of failure
#   liveness   6 × 10s — a full minute of silence before a restart; an
#                        aggressive liveness probe restarts a database in the
#                        middle of a long checkpoint and makes things worse
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: '17.5'
  annotations:
    kubernetes.io/description: PostgreSQL holding the catalog and orders databases
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: exec-probes,startup-probe
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: '17.5'
    spec:
      containers:
      - name: postgres
        image: postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: ecommerce
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: catalog
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
        startupProbe:
          exec: &id001
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U ecommerce -d catalog
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/part-of: ecommerce
    spec:
      storageClassName: ecommerce-gp3
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
