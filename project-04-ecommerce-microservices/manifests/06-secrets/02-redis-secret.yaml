# 06-secrets/02-redis-secret.yaml
# WHY: The Redis password was on Redis's COMMAND LINE (visible in `ps` and in
#      `kubectl describe pod`) and a literal in the cart Deployment. Now it lives
#      in one Secret, read by exactly two workloads: redis and cart.
#
# 🧪 DEMO: in Git, base64 only. See 01-postgres-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis-secret
    app.kubernetes.io/instance: redis-secret
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "Redis password — shared by redis and cart"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref"
type: Opaque
stringData:
  REDIS_PASSWORD: "dev-redis-password-not-for-production"
