# 06-secrets/01-postgres-secret.yaml
# WHY: The PostgreSQL password was a literal in THREE Deployments (postgres,
#      catalog, order) — readable by anyone with `get deployments`, committed to
#      Git, and impossible to rotate without editing three files in lockstep.
#
#      A Secret is a separate object so it can be (a) handled by different RBAC
#      than Deployments, (b) referenced from many places and changed in one, and
#      (c) kept out of workload manifests entirely.
#
# 🧪 DEMO: this file is still in Git, and `stringData` is still plaintext here.
#    A Secret is BASE64-ENCODED in etcd, not encrypted — `base64 -d` reverses it.
#    The protection is RBAC on `get secrets`, plus etcd encryption at rest (EKS
#    encrypts etcd volumes; envelope encryption with KMS is an opt-in).
# 🏭 PRODUCTION: AWS Secrets Manager + External Secrets Operator, authorised with
#    EKS Pod Identity. Nothing secret ever enters Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/instance: postgres-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL password — shared by postgres, catalog and order"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref,base64-is-not-encryption"
type: Opaque
# stringData: you write plain text; the API server base64-encodes it into `data`.
stringData:
  POSTGRES_PASSWORD: "dev-password-not-for-production"
