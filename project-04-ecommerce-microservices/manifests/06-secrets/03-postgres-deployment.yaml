# 06-secrets/03-postgres-deployment.yaml
# WHAT CHANGED from 03-deployments/postgres-deployment.yaml:
#   POSTGRES_PASSWORD now comes from Secret/postgres-secret via secretKeyRef.
#
# ⚠️ The password is only USED at first initialisation of the data directory.
#    Change the Secret after the database exists and PostgreSQL keeps the old
#    password — the Secret and the database now disagree, and every client gets
#    `password authentication failed`. Rotation is ALTER USER, then the Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL holding the catalog and orders databases"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secretkeyref"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "17.5"
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "ecommerce"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "catalog"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
      volumes:
        - name: init
          configMap:
            name: postgres-init
