# 06-secrets/05-catalog-deployment.yaml
# WHAT CHANGED from 05-configmaps: the password is now a secretKeyRef, not a
# literal. The shared ConfigMap and the OWNED env are unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Product catalogue — owns the catalog database"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secretkeyref"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: catalog
          image: cloudprakhargupta/ecommerce:catalog-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: POSTGRES_DB
              value: "catalog"            # OWNED
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
