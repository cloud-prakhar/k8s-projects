# 07-storage/05-redis-deployment.yaml
# WHAT CHANGED from 06-secrets/04-redis-deployment.yaml:
#   * /data (where the rendered config tells Redis to keep its append-only file)
#     is now a PersistentVolumeClaim, so baskets survive a pod replacement
#   * strategy: Recreate — one EBS volume, one EC2 instance at a time
#   * fsGroup: 1000 — a fresh ext4 filesystem is owned by root; Redis runs as
#     UID 999 / GID 1000 and could not write its AOF to /data without this
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "Redis holding session baskets with a TTL"
    lab.k8s-project/stage: "07-storage"
    lab.k8s-project/teaches: "pvc,recreate-strategy,fsgroup"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "8.2.9"
    spec:
      # Overriding `command` bypasses the image's entrypoint (which normally drops
      # root → redis), so the user is set here explicitly.
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000          # kubelet chowns the new EBS volume to this GID on mount
      containers:
        - name: redis
          image: redis:8.2.9-alpine
          imagePullPolicy: IfNotPresent
          # `exec` replaces the shell, so redis-server is PID 1 and receives
          # SIGTERM directly on shutdown.
          command: ["sh", "-c"]
          args:
            - |
              printf 'requirepass %s\nappendonly yes\ndir /data\n' "$REDIS_PASSWORD" > /run/redis/redis.conf
              exec redis-server /run/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            # redis-cli reads REDISCLI_AUTH, so probes and `kubectl exec
            # redis-cli` authenticate without a password on the command line.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rendered-config
              mountPath: /run/redis
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: rendered-config
          emptyDir:
            medium: Memory       # tmpfs: never written to the node's disk
            sizeLimit: 1Mi
