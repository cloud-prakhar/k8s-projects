# 04-services/payment-service.yaml
# WHY: `order` calls PAYMENT_URL=http://payment:8080. This Service makes that
#      name resolve.
#
# 🔴 READ THIS ONE TWICE. Creating this Service makes `payment` reachable BY
#    NAME FROM EVERY POD IN THE CLUSTER — not just from `order`. A Service is a
#    discovery and load-balancing mechanism; it is NOT an access control. There
#    is no field here that says "only order may connect".
#
#    Stage 15 proves it: a throwaway pod will authorise a payment, and the
#    service's own /whoami counter will show the caller. Fixing that needs a
#    NetworkPolicy, which is a different object enforced by a different
#    component (the VPC CNI's network policy agent).
#
# ⚠️ port == targetPort: required by the VPC CNI network policy engine (see
#    catalog-service.yaml for the full explanation and the source).
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/instance: payment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "ClusterIP for the payment service — reachable by every pod until stage 15 restricts it"
    lab.k8s-project/stage: "04-services"
    lab.k8s-project/teaches: "clusterip,service-is-not-access-control"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment
    app.kubernetes.io/instance: payment
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
