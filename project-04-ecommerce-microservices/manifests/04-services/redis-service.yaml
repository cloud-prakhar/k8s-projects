# 04-services/redis-service.yaml
# WHY: `cart` is configured with REDIS_HOST=redis and cannot resolve it. This
#      Service is the fix.
#
#      Only ONE service should ever connect here — `cart` — which makes stage
#      15's `allow-cart-to-redis` the simplest policy in the project and the
#      easiest to verify: any other pod that tries should hang.
#
# ⚠️ port == targetPort (6379): required by the VPC CNI network policy engine
#    (see catalog-service.yaml for the full explanation and the source).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "ClusterIP for Redis — used only by the cart service"
    lab.k8s-project/stage: "04-services"
    lab.k8s-project/teaches: "clusterip,dns,single-client-datastore"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
