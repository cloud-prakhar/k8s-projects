# 04-services/cart-service.yaml
# WHY: `storefront` calls CART_URL=http://cart:8080. Without this Service that
#      name does not resolve, and the basket panel shows a 502 naming the URL.
#
# ⚠️ port == targetPort: required by the VPC CNI network policy engine (see
#    catalog-service.yaml for the full explanation and the source).
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: cart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Stable ClusterIP and DNS name for the cart service"
    lab.k8s-project/stage: "04-services"
    lab.k8s-project/teaches: "clusterip,selectors,endpointslice,dns"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: cart
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
