# 04-services/order-service.yaml
# WHY: `storefront` calls ORDER_URL=http://order:8080, and the ALB will route
#      /api/orders here in stage 09. Both need the name to exist.
#
# ⚠️ port == targetPort: required by the VPC CNI network policy engine (see
#    catalog-service.yaml for the full explanation and the source).
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: order
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Stable ClusterIP and DNS name for the order service"
    lab.k8s-project/stage: "04-services"
    lab.k8s-project/teaches: "clusterip,selectors,endpointslice,dns"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: order
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
