# 04-services/storefront-service.yaml
# WHY: The UI needs a stable name too — the ALB's `/` rule will point at this
#      Service in stage 09, and `kubectl port-forward` uses it before then.
#
# ⚠️ PORT 8080, NOT 80. The conventional thing here is `port: 80` mapped to the
#    container's 8080, and on most clusters that is fine. It is NOT fine here:
#    the Amazon VPC CNI network policy engine requires a Service's port to equal
#    the container port. Publishing 80 would leave stage 15's policies enforcing
#    against a port nothing listens on — a failure that looks random and costs an
#    afternoon. Consistency with the other six Services is the cheaper habit.
#    Source: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/instance: storefront
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Stable ClusterIP for the shop UI; the ALB's default backend"
    lab.k8s-project/stage: "04-services"
    lab.k8s-project/teaches: "clusterip,selectors,endpointslice,dns"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/instance: storefront
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
