# 03-deployments/postgres-deployment.yaml
# WHY: `catalog` and `order` both need a durable store. This stage runs
#      PostgreSQL as a Deployment, which WORKS today and fails instructively in
#      stage 07 (a replaced pod loses every product and order, because the data
#      is in the container's own filesystem).
#
# 🧪 DEMO: ONE PostgreSQL server holding TWO databases — `catalog` and `orders`.
#    Database-per-service is the production pattern; four servers would triple
#    this lab's cost and runtime while teaching nothing about routing or network
#    policy. The ownership boundary is kept honest instead: no service reads
#    another's database, and `order` copies prices rather than joining.
#
# ⚠️ The password is in plaintext here, on purpose. Stage 06 moves it to a
#    Secret once you have seen it sitting in `kubectl get deploy -o yaml`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL holding the catalog and orders databases"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,database-as-deployment"
spec:
  # ONE. Two replicas would be two unrelated, empty databases behind one
  # Service — not a cluster, and not replication.
  replicas: 1
  selector:
    matchLabels:
      # Minimal and STABLE: these two labels are immutable once created.
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "17.5"
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres          # named, so Services and probes can reference the NAME
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "ecommerce"
            - name: POSTGRES_PASSWORD
              value: "dev-password-not-for-production"   # ⚠️ stage 06 fixes this
            # The image creates exactly one database at first start. `orders` is
            # created by the init script mounted below.
            - name: POSTGRES_DB
              value: "catalog"
            # PGDATA must be a SUBDIRECTORY of any mounted volume, not the mount
            # point itself — a fresh filesystem contains lost+found and initdb
            # refuses a non-empty directory. It costs nothing now and means
            # stage 07 can add a volume without changing this line.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            # Anything in this directory runs ONCE, at first initialisation.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
      volumes:
        - name: init
          configMap:
            name: postgres-init
