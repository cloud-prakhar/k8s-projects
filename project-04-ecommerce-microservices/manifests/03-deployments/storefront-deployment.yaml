# 03-deployments/storefront-deployment.yaml
# WHY: The shop UI, and the fan-out point of the call graph. It serves `/` and
#      proxies `/api/catalog`, `/api/cart` and `/api/orders` to three separate
#      services, SERVER-SIDE.
#
#      Proxying rather than letting the browser call each API directly is a
#      deliberate design choice: it makes this pod a REAL in-cluster client of
#      three other services, resolving each by DNS and connecting over the pod
#      network. In this stage you will watch all three lookups fail. If the
#      browser did the calling, none of that would be visible from inside the
#      cluster at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/instance: storefront
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shop UI — fans out to catalog, cart and order"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,east-west-traffic,service-discovery-by-name"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
      app.kubernetes.io/instance: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/instance: storefront
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: storefront
          image: cloudprakhargupta/ecommerce:storefront-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # THREE names, none of which resolves yet. The UI will render and
            # every panel will show a 502 naming the URL it could not reach —
            # which is the whole lesson of this stage.
            - name: CATALOG_URL
              value: "http://catalog:8080"
            - name: CART_URL
              value: "http://cart:8080"
            - name: ORDER_URL
              value: "http://order:8080"
            # Bound every upstream call. A storefront that waits forever on one
            # slow backend is how a partial failure becomes a total one.
            - name: UPSTREAM_TIMEOUT_SECONDS
              value: "3"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
