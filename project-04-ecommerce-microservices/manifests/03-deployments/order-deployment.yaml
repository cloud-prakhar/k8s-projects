# 03-deployments/order-deployment.yaml
# WHY: Checkout. `order` is the busiest node in the call graph and the only
#      service permitted to call `payment` — the single edge that this whole
#      project exists to enforce.
#
#      It talks to TWO dependencies by name:
#        POSTGRES_HOST → its own `orders` database (not catalog's)
#        PAYMENT_URL   → the service nothing else may reach
#
# UPSTREAM_TIMEOUT_SECONDS is the most important number in this file. Without a
# bound, a SLOW payment service makes every checkout request block, then every
# storefront request waiting on it block, and the whole site degrades from one
# late dependency. Stage 11 and Project 05 take that apart properly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: order
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Checkout — owns the orders database and is the only caller of payment"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,east-west-traffic,upstream-timeout"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order
      app.kubernetes.io/instance: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/instance: order
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: order
          image: cloudprakhargupta/ecommerce:order-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: "postgres"
            # ⚠️ SET EXPLICITLY, even though 5432 is the app's default. Once a
            # Service named `postgres` exists, the kubelet injects legacy
            # "service link" variables into every NEW pod in the namespace —
            # including POSTGRES_PORT=tcp://10.100.x.x:5432. Leave this unset and
            # the app reads that string as a port number and every connection
            # fails. (`enableServiceLinks: false` on the pod turns the injection off.)
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "orders"              # ← NOT catalog's database
            - name: POSTGRES_USER
              value: "ecommerce"
            - name: POSTGRES_PASSWORD
              value: "dev-password-not-for-production"   # ⚠️ stage 06 fixes this
            - name: PAYMENT_URL
              value: "http://payment:8080" # ← the guarded edge
            # Give up on a slow upstream rather than blocking forever. Three
            # seconds is a lab value; production sizes this from real p99.
            - name: UPSTREAM_TIMEOUT_SECONDS
              value: "3"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
