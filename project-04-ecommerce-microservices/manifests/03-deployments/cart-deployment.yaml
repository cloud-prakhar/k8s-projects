# 03-deployments/cart-deployment.yaml
# WHY: Session baskets, held in Redis. `cart` is the ONLY service that should
#      ever reach Redis — a basket is per-session state nothing else owns —
#      which makes it the easiest NetworkPolicy in stage 15 to justify and to
#      verify.
#
#      Note that Redis is a HARD dependency here, unlike a cache. Losing it
#      loses baskets, so stage 11's readiness probe checks it and the pod
#      leaves the load balancer when Redis is gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: cart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Session baskets in Redis — the only service permitted to reach Redis"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,service-discovery-by-name"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      app.kubernetes.io/instance: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/instance: cart
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: cart
          image: cloudprakhargupta/ecommerce:cart-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_HOST
              value: "redis"               # ← another name that does not exist yet
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "dev-redis-password-not-for-production"   # ⚠️ stage 06
            # How long an idle basket survives. Every write refreshes it, so an
            # active shopper never loses their basket mid-session.
            - name: CART_TTL_SECONDS
              value: "1800"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
