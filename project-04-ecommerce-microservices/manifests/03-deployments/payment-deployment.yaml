# 03-deployments/payment-deployment.yaml
# WHY: `payment` authorises money. It holds no data and calls nothing, so the
#      only interesting question about it is WHO IS ALLOWED TO CALL IT — and
#      right now the answer is "every pod in the cluster", including any
#      compromised one. That is the problem stage 15 exists to solve.
#
#      Two env vars make this service a teaching instrument:
#        PAYMENT_LATENCY_MS — make it SLOW without making it fail
#        PAYMENT_FAIL_RATE  — decline a fraction of authorisations
#      Both default to 0 and are turned up deliberately in stage 11 and in the
#      failure labs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/instance: payment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Payment authorisation — reachable only by the order service (from stage 15)"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,east-west-traffic"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
      app.kubernetes.io/instance: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/instance: payment
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: payment
          image: cloudprakhargupta/ecommerce:payment-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAYMENT_LATENCY_MS
              value: "0"          # stage 11 and the failure labs turn this up
            - name: PAYMENT_FAIL_RATE
              value: "0"
            # Downward API: the pod's own name, so /whoami and every response
            # can say which replica answered.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
