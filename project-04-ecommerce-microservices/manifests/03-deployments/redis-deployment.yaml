# 03-deployments/redis-deployment.yaml
# WHY: `cart` keeps session baskets in Redis. Unlike Project 03's cache, Redis
#      here is a HARD dependency — it IS the cart, so losing it loses baskets.
#
#      Like PostgreSQL, it runs as a Deployment in this stage and is replaced by
#      a StatefulSet in stage 08, after you have watched a pod replacement throw
#      every basket away.
#
# ⚠️ The password is on the COMMAND LINE here, which means it is visible in
#    `ps`, in `kubectl describe pod`, and to anyone who can read this manifest.
#    Stage 06 moves it into a Secret and off the command line.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "Redis holding session baskets with a TTL"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,datastore-as-deployment"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: ecommerce
        app.kubernetes.io/version: "8.2.9"
    spec:
      containers:
        - name: redis
          image: redis:8.2.9-alpine
          imagePullPolicy: IfNotPresent
          # ⚠️ stage 06 replaces this with a rendered config file, so the
          #    password stops appearing in the process list.
          args:
            - redis-server
            - --requirepass
            - dev-redis-password-not-for-production
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          env:
            # redis-cli reads this, so probes and `kubectl exec … redis-cli`
            # authenticate without the password appearing in every command.
            - name: REDISCLI_AUTH
              value: dev-redis-password-not-for-production
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
