# 15-security/06-allow-catalog-egress.yaml
# WHY: catalog talks to exactly one thing: its database (including the migrate
#      init container, which carries the same pod labels).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-egress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-catalog-egress
    app.kubernetes.io/instance: allow-catalog-egress
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "catalog may reach PostgreSQL on 5432"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,egress"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
