# 15-security/07-allow-cart-egress.yaml
# WHY: cart talks to exactly one thing: Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cart-egress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-cart-egress
    app.kubernetes.io/instance: allow-cart-egress
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "cart may reach Redis on 6379"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,egress"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cart
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
