# 15-security/10-allow-cart-to-redis.yaml
# WHY: Baskets belong to cart. One client, one rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cart-to-redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-cart-to-redis
    app.kubernetes.io/instance: allow-cart-to-redis
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Redis accepts connections from cart only"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,ingress,least-privilege"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cart
      ports:
        - protocol: TCP
          port: 6379
