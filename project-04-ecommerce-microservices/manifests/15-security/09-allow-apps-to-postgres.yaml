# 15-security/09-allow-apps-to-postgres.yaml
# WHY: Two services own databases on this server. Nothing else — not the
#      storefront, not payment, not a debug pod — may open a connection to 5432.
#      Two list items under `from` = OR: catalog pods OR order pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-postgres
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-apps-to-postgres
    app.kubernetes.io/instance: allow-apps-to-postgres
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "PostgreSQL accepts connections from catalog and order only"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,ingress,least-privilege"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order
      ports:
        - protocol: TCP
          port: 5432
