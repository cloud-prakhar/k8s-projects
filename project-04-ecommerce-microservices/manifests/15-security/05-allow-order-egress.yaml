# 15-security/05-allow-order-egress.yaml
# WHY: order is the only service whose call graph includes payment. Egress on
#      the SOURCE is half of an edge; 08-allow-order-to-payment is the other
#      half, on the destination. Both must allow a flow for it to pass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-egress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-order-egress
    app.kubernetes.io/instance: allow-order-egress
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "order may call payment on 8080 and PostgreSQL on 5432"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,egress"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
