# 15-security/04-allow-storefront-egress.yaml
# WHY: Egress is denied by default now. The storefront's proxy and /whoami call
#      three upstreams; list exactly those. Notice what is NOT here: payment,
#      postgres, redis. A compromised storefront can no longer reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-egress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-storefront-egress
    app.kubernetes.io/instance: allow-storefront-egress
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "storefront may call catalog, cart and order on 8080 — and nothing else"
    lab.k8s-project/stage: "15-security"
    lab.k8s-project/teaches: "networkpolicy,egress"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storefront
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cart
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order
      ports:
        - protocol: TCP
          port: 8080
