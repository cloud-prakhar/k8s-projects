# 00-namespace/namespace.yaml
# WHY: Five services, two datastores, seven Services, two Secrets, an ALB, two
#      EBS volumes and seven NetworkPolicies are about to exist. Put them in
#      `default` on a shared cluster and you cannot delete just this project,
#      cannot tell your objects from anyone else's, and your `Service/redis`
#      collides with the next team's `Service/redis`.
#
#      A namespace is also the unit POLICY attaches to. NetworkPolicies are
#      namespaced, and stage 15's `default-deny-all` selects every pod *in this
#      namespace*. Without a namespace of its own there would be nothing to
#      scope that policy to.
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    kubernetes.io/description: "E-commerce microservices — storefront, catalog, cart, order, payment, PostgreSQL and Redis"
    lab.k8s-project/stage: "00-namespace"
    lab.k8s-project/teaches: "namespace,scope,policy-boundary"
