# 03-deployments/task-web-deployment.yaml
# WHY: The frontend needs the same lifecycle management as the backend.
# NOTE: TASK_API_URL is a HARDCODED POD IP here, on purpose. It will break the
#       moment any backend Pod is recreated. That breakage motivates stage 04.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-web
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-web
    app.kubernetes.io/instance: task-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Task Tracker web UI — serves the SPA and proxies /api to the backend"
    lab.k8s-project/stage: "03-deployments"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: task-web
      app.kubernetes.io/instance: task-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-web
        app.kubernetes.io/instance: task-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: task-tracker
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: task-web
          image: task-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ⚠️ BROKEN BY DESIGN — replace with a real Pod IP from
            #    `kubectl get pods -o wide`, then delete that Pod and watch this fail.
            - name: TASK_API_URL
              value: "http://10.244.0.99:8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
