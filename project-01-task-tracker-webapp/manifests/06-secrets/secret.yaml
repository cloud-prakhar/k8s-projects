# 06-secrets/secret.yaml
# 🧪 DEMO / LEARNING CONFIGURATION — this file is committed to Git with a
#    readable credential in it. NEVER do this outside a lab. See §11 of the
#    stage README for what production does instead.
#
# WHY: the API token must not sit in the ConfigMap next to LOG_LEVEL. Secrets
#      are a distinct kind so they can be handled differently: separate RBAC,
#      kept out of `describe` output, optionally encrypted at rest in etcd,
#      stored in tmpfs (not on disk) when mounted as a volume.
apiVersion: v1
kind: Secret
metadata:
  name: task-api-secret
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-api-secret
    app.kubernetes.io/instance: task-api-secret
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shared API token between the web tier and the task API"
    lab.k8s-project/stage: "06-secrets"
type: Opaque   # generic key/value. Other types: kubernetes.io/tls, /dockerconfigjson, /basic-auth
# `stringData` takes plain text and the API server base64-encodes it for you.
# Use it in manifests you write by hand — it is far less error-prone than
# base64-ing values yourself, and it is exactly as (in)secure. Base64 is
# ENCODING, NOT ENCRYPTION: anyone who can read this object can read the value.
stringData:
  API_TOKEN: "dev-token-not-for-production"
