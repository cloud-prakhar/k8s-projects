# 06-secrets/task-api-deployment.yaml
# WHAT CHANGED: API_TOKEN is injected from the Secret. The moment the API sees a
#               non-empty token it starts REQUIRING the X-API-Token header,
#               so the web tier must send it too (see task-web below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/instance: task-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Task API backend — authenticated with a Secret-provided token"
    lab.k8s-project/stage: "06-secrets"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: task-api
      app.kubernetes.io/instance: task-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-api
        app.kubernetes.io/instance: task-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: task-tracker
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: task-api
          image: task-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # envFrom pulls in EVERY key of the ConfigMap as an env var of the
          # same name. Convenient, but you lose the explicit list of what the
          # container consumes — a real trade-off, not a best practice.
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-api-secret
                  key: API_TOKEN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
