# 19-final/complete-production-manifest.yaml
# ---------------------------------------------------------------------------
# THE COMPLETE DESIRED STATE of Project 01, in one file.
#
# WHY this file exists: stages 00→11 each showed ONE resource at the moment it
# was needed, so the final version of task-api is spread across 05, 06 and 11.
# That is excellent for learning and bad for operating — apply order changes the
# result. This file is the single source of truth: apply it in any state and the
# cluster converges to the same place.
#
# `---` separates documents. Multi-document files are avoided during the
# teaching stages (one resource per file) and used only here.
#
# Apply:    kubectl apply -f manifests/19-final/complete-production-manifest.yaml
# Or:       kubectl apply -k manifests/19-final/
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/part-of: task-tracker
  annotations:
    kubernetes.io/description: "Project 01 — Task Tracker web application"

---
# --- Configuration: non-sensitive, shared by both tiers --------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-tracker-config
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker-config
    app.kubernetes.io/instance: task-tracker-config
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Non-sensitive configuration shared by the web and API tiers"
data:
  APP_ENV: "development"
  LOG_LEVEL: "info"
  TASK_API_URL: "http://task-api.task-tracker.svc.cluster.local:8080"

---
# --- Credentials ----------------------------------------------------------
# 🧪 DEMO ONLY — a real credential must never be committed. See 06-secrets/README.md §11.
apiVersion: v1
kind: Secret
metadata:
  name: task-api-secret
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-api-secret
    app.kubernetes.io/instance: task-api-secret
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shared API token between the web tier and the task API"
type: Opaque
stringData:
  API_TOKEN: "dev-token-not-for-production"

---
# --- Backend: task-api ----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/instance: task-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Task API backend — config, secret and probes combined"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: task-api
      app.kubernetes.io/instance: task-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-api
        app.kubernetes.io/instance: task-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: task-tracker
        app.kubernetes.io/version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: task-api
          image: task-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-api-secret
                  key: API_TOKEN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: task-api
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/instance: task-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Stable in-cluster endpoint for the task API"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/instance: task-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# --- Frontend: task-web ---------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-web
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-web
    app.kubernetes.io/instance: task-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Task Tracker web UI — serves the SPA and proxies /api to the backend"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: task-web
      app.kubernetes.io/instance: task-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-web
        app.kubernetes.io/instance: task-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: task-tracker
        app.kubernetes.io/version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: task-web
          image: task-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TASK_API_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: TASK_API_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-api-secret
                  key: API_TOKEN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: task-web
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-web
    app.kubernetes.io/instance: task-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Stable in-cluster endpoint for the web tier"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: task-web
    app.kubernetes.io/instance: task-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
