# 14-pdb/01-webapp-pdb.yaml
# WHY: `kubectl drain` (and a managed node group upgrade, and the cluster
#      autoscaler) evict pods through the EVICTION API. Without a budget, a node
#      holding two of three replicas loses both at once. A PDB makes the
#      eviction API refuse (HTTP 429) any eviction that would leave the selected
#      pods more than `maxUnavailable` short — drain simply waits and retries.
#
# maxUnavailable: 1, not minAvailable: N — it stays correct when the HPA scales
# from 3 to 12. `minAvailable: 3` with 3 replicas would allow ZERO evictions and
# block every drain forever (a failure lab).
#
# PDBs cover VOLUNTARY disruptions only. A node that dies is not asked.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webapp-pdb
  namespace: web-platform
  labels:
    app.kubernetes.io/name: webapp-pdb
    app.kubernetes.io/instance: webapp-pdb
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: Never let voluntary disruptions take more than one webapp pod at a time
    lab.k8s-project/stage: 14-pdb
    lab.k8s-project/teaches: pdb,eviction,drain
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
