# 14-pdb/02-webapp-deployment.yaml
# WHAT CHANGED: a PREFERRED pod anti-affinity on kubernetes.io/hostname — "try
# not to put two webapp pods on the same node".
#
# A PDB limits how fast pods leave; it does nothing about WHERE they were. If
# all three replicas sat on one node, draining it would still take them one at a
# time — but the node would still be a single point of failure for an
# UNvoluntary crash. Spreading and budgeting are two halves of one idea.
#
# `preferred`, not `required`: with 12 HPA replicas on 3 nodes, a hard rule
# would leave 9 pods Pending. Project 09 covers topology spread properly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 2.0.0
  annotations:
    kubernetes.io/description: "The web application \u2014 spread across nodes"
    lab.k8s-project/stage: 14-pdb
    lab.k8s-project/teaches: pod-anti-affinity
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: webapp
                  app.kubernetes.io/instance: webapp
