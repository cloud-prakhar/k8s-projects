# 13-hpa/02-webapp-deployment.yaml
# WHAT CHANGED: `spec.replicas` is GONE.
#
# Once an HPA manages a Deployment, two things want to set .spec.replicas: the
# HPA (continuously) and your manifest (on every apply). Keep `replicas: 3`
# here and every `kubectl apply` during a traffic peak resets 9 pods to 3 — the
# autoscaler's decision silently undone by a config change. Omitting the field
# leaves it to the HPA. (On first creation, an omitted field defaults to 1 and
# the HPA raises it to minReplicas within seconds.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 2.0.0
  annotations:
    kubernetes.io/description: "The web application \u2014 replicas owned by the HPA"
    lab.k8s-project/stage: 13-hpa
    lab.k8s-project/teaches: hpa-owned-replicas
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      terminationGracePeriodSeconds: 45
