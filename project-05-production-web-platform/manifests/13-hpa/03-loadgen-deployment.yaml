# 13-hpa/03-loadgen-deployment.yaml
# WHY: You cannot learn autoscaling without load. This runs the loadgen image
#      against the in-cluster Service, 16 concurrent requests each burning 80ms
#      of CPU, and prints a per-second table to its logs.
#
# replicas: 0 — it does nothing until you scale it:
#   kubectl scale deployment/loadgen -n web-platform --replicas=2   # start
#   kubectl logs deployment/loadgen -n web-platform -f               # watch
#   kubectl scale deployment/loadgen -n web-platform --replicas=0   # stop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: web-platform
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/instance: loadgen
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: "In-cluster load generator \u2014 scale it to apply load"
    lab.k8s-project/stage: 13-hpa
    lab.k8s-project/teaches: load-testing
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
      app.kubernetes.io/instance: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/instance: loadgen
        app.kubernetes.io/component: job
        app.kubernetes.io/part-of: web-platform
        app.kubernetes.io/version: 1.0.0
    spec:
      containers:
      - name: loadgen
        image: cloudprakhargupta/web-platform:loadgen-1.0.0
        imagePullPolicy: IfNotPresent
        args:
        - --url
        - http://webapp:8080/api/work?ms=80
        - --concurrency
        - '16'
        - --duration
        - '3600'
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
