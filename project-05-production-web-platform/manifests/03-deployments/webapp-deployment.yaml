# 03-deployments/webapp-deployment.yaml
# WHY: Three replicas of the web app — self-healing and rollable.
#
# 🧪 DELIBERATELY INCOMPLETE, and this is a teaching exception to the repo's
#    "every container has requests" convention:
#      • NO resources  — the pod is QoS class BestEffort. The scheduler reserves
#                        nothing for it and the kubelet evicts it first. Stage 12.
#      • NO probes     — "Running" is all Kubernetes knows. Stage 11.
#      • NO preStop    — rollouts will drop requests. Stage 11.
#    Each gap is a failure you will watch happen before it is fixed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: "The web application \u2014 no resources, no probes (on purpose)"
    lab.k8s-project/stage: 03-deployments
    lab.k8s-project/teaches: deployment,besteffort
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
