# 12-resources/03-webapp-deployment.yaml
# WHAT CHANGED: resources. Every number here is a decision:
#
#   requests.cpu    100m   What the SCHEDULER reserves on a node, and the
#                          denominator the HPA divides by in stage 13. Sized to
#                          the app's idle-plus-light-traffic use.
#   limits.cpu      500m   A CEILING enforced by CFS throttling. Exceed it and
#                          the container is paused for the rest of each 100ms
#                          period — latency rises, nothing is killed.
#   requests.memory 128Mi  Reserved; about two idle gunicorn workers.
#   limits.memory   256Mi  A HARD wall. Exceed it and the kernel OOM-kills the
#                          process: exit 137, reason OOMKilled, restart.
#
# requests < limits ⇒ QoS class Burstable. requests == limits for BOTH cpu and
# memory would be Guaranteed (last to be evicted); none at all, BestEffort
# (first). The QoS class is computed, never set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 2.0.0
  annotations:
    kubernetes.io/description: "The web application \u2014 sized: requests and limits"
    lab.k8s-project/stage: 12-resources
    lab.k8s-project/teaches: requests,limits,qos-burstable
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      terminationGracePeriodSeconds: 45
