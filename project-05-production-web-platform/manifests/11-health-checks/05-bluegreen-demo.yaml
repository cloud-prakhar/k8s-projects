# 11-health-checks/05-bluegreen-demo.yaml
# BLUE/GREEN, with nothing but labels. Two complete stacks run side by side;
# the Service selects exactly ONE by `instance`. Switching colour is a single
# selector patch — atomic for new connections, instantly reversible — at the
# cost of running both stacks during the switch.
#
# A self-contained demo (its own Service, name=webapp-bg so the main Service
# never matches it). Multiple objects in one file, because the three only make
# sense together; delete them after §8 of the stage README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-blue
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp-bg
    app.kubernetes.io/instance: webapp-blue
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: "Blue/green demo \u2014 the blue (1.0.0) stack"
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: blue-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-bg
      app.kubernetes.io/instance: webapp-blue
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-green
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp-bg
    app.kubernetes.io/instance: webapp-green
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 2.0.0
  annotations:
    kubernetes.io/description: "Blue/green demo \u2014 the green (2.0.0) stack"
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: blue-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-bg
      app.kubernetes.io/instance: webapp-green
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-bluegreen
  namespace: web-platform
  labels:
    app.kubernetes.io/name: webapp-bg
    app.kubernetes.io/instance: webapp-bluegreen
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: 'Blue/green switch: the selector names exactly one colour'
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: blue-green,service-selector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webapp-bg
    app.kubernetes.io/instance: webapp-blue
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
