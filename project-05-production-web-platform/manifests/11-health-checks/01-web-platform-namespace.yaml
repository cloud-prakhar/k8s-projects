# 11-health-checks/01-web-platform-namespace.yaml
# WHAT CHANGED: elbv2.k8s.aws/pod-readiness-gate-inject: enabled. New pods get
# a readiness gate that stays False until the ALB reports them HEALTHY, so a
# rollout never removes an old pod before the ALB trusts its replacement.
apiVersion: v1
kind: Namespace
metadata:
  name: web-platform
  labels:
    app.kubernetes.io/name: web-platform
    app.kubernetes.io/instance: web-platform
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: kubectl
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  annotations:
    kubernetes.io/description: "Production web platform \u2014 one traffic-serving app, made observable under load"
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: namespace,alb-readiness-gate
