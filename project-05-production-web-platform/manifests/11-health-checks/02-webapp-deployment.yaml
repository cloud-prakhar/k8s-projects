# 11-health-checks/02-webapp-deployment.yaml
# WHAT CHANGED — the four things a zero-drop rollout needs, and why each one:
#
#   startupProbe   /healthz, 30 × 2s   The app takes ~8s to warm up. Until it
#                                       passes, readiness and liveness do not run.
#   readinessProbe /healthz, 2 × 5s    No traffic until genuinely ready.
#   livenessProbe  /livez              The PROCESS only — never load, never startup.
#   maxSurge 1 / maxUnavailable 0      Never fewer ready pods than desired.
#
#   preStop: sleep 20                   THE FIX FOR THE 502s. On deletion the pod
#                                       is removed from endpoints and SIGTERM is
#                                       sent AT THE SAME TIME. gunicorn stops
#                                       accepting instantly; the ALB takes seconds
#                                       to deregister. The sleep keeps the pod
#                                       SERVING until nobody is sending to it.
#                                       (Native `sleep` action: no shell needed.)
#   terminationGracePeriodSeconds 45    The whole budget: preStop (20) +
#                                       gunicorn graceful-timeout (25) must fit,
#                                       or in-flight requests are SIGKILLed.
#
# Also: image 2.0.0 — applying this IS the rollout you will measure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 2.0.0
  annotations:
    kubernetes.io/description: "The web application \u2014 probes, zero-drop rollout, graceful shutdown"
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: probes,rolling-update,prestop,termination-grace-period
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      terminationGracePeriodSeconds: 45
