# 11-health-checks/04-webapp-service.yaml
# WHAT CHANGED from 04-services: the selector drops `instance`.
#
#   Service     selects  name=webapp                 ← the APPLICATION
#   Deployment  selects  name=webapp, instance=webapp ← one INSTANCE of it
#   canary      selects  name=webapp, instance=webapp-canary
#
# That asymmetry is the entire mechanism of a label-based canary.
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: web-platform
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: Stable name and ClusterIP for the web app
    lab.k8s-project/stage: 11-health-checks
    lab.k8s-project/teaches: selector-asymmetry,canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webapp
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
