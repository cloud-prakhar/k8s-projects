# 04-services/webapp-service.yaml
# WHY: Three pods, three changing IPs. The load generator, the ALB and you all
#      need ONE stable name — `webapp` — that spreads load over READY pods.
#      Stage 11 widens this selector for the canary; see the note there.
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: web-platform
  labels:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: Stable name and ClusterIP for the web app
    lab.k8s-project/stage: 04-services
    lab.k8s-project/teaches: clusterip,endpointslice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
