# 05-configmaps/02-webapp-deployment.yaml
# WHAT CHANGED: envFrom webapp-config. From now on every new pod spends eight
# seconds starting up — and with no readiness probe, the Service sends it
# traffic during all eight. Watch the error rate on the next rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: web-platform
  labels: &id001
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webapp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: web-platform
    app.kubernetes.io/version: 1.0.0
  annotations:
    kubernetes.io/description: "The web application \u2014 configured from a ConfigMap"
    lab.k8s-project/stage: 05-configmaps
    lab.k8s-project/teaches: envfrom
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webapp
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: webapp
        image: cloudprakhargupta/web-platform:webapp-1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
