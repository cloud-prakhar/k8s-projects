# 00-namespace/02-analytics-namespace.yaml
# WHY: The analytics collector belongs to a DIFFERENT team. Giving it its own
#      namespace makes the dependency honest: the shortener cannot reach it by a
#      short name, cannot see its objects in `kubectl get -n url-shortener`, and
#      will need a real cross-namespace answer in stage 04 (an ExternalName
#      Service). On a real platform this namespace would carry its own RBAC and
#      quotas; that is Project 07.
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: analytics
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    kubernetes.io/description: "Another team's analytics platform — the shortener's external dependency"
    lab.k8s-project/stage: "00-namespace"
    lab.k8s-project/teaches: "namespaces,ownership-boundaries"
