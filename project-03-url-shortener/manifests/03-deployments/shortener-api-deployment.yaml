# 03-deployments/shortener-api-deployment.yaml
# WHY: The API is the product: create a link, follow a link. It needs three
#      things on the network — PostgreSQL, Redis and the analytics collector —
#      and it asks for them BY NAME: `postgres`, `redis`, `analytics`.
#
#      Nothing in the cluster answers to those names yet. Watch what the pods
#      do about it; that failure is the lesson of this stage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-api
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: shortener-api
    app.kubernetes.io/instance: shortener-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shortener REST API and redirector — two stateless replicas"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,dns-dependency"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener-api
      app.kubernetes.io/instance: shortener-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener-api
        app.kubernetes.io/instance: shortener-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: url-shortener
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: shortener-api
          # One registry repository, three images, told apart by tag prefix.
          # EKS nodes pull it like any other image — there is no side-loading
          # on a managed cluster.
          image: cloudprakhargupta/url-shortener:api-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # --- dependencies, by NAME. None of these names exist yet. ---
            - name: POSTGRES_HOST
              value: "postgres"
            - name: REDIS_WRITE_HOST
              value: "redis"
            - name: REDIS_READ_HOST
              value: "redis"
            - name: ANALYTICS_URL
              value: "http://analytics/events"
            # --- the rest of the connection details ---
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "shortener"
            - name: POSTGRES_USER
              value: "shortener"
            - name: POSTGRES_PASSWORD           # ⚠️ plaintext until stage 06
              value: "dev-password-not-for-production"
            - name: REDIS_PORT
              value: "6379"
            # --- behaviour ---
            - name: CODE_LENGTH
              value: "6"
            - name: CACHE_TTL_SECONDS
              value: "300"
            - name: APP_ENV
              value: "lab"
            # Downward API: the pod's own name, so every response says who answered.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
