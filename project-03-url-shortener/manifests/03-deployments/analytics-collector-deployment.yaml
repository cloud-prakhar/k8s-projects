# 03-deployments/analytics-collector-deployment.yaml
# WHY: A stand-in for another team's analytics service, running in THEIR
#      namespace. The shortener sends it one event per click. It is deployed
#      here only so this project has a real, reachable, other-owner dependency to
#      wire up in stage 04 — you would not normally deploy somebody else's system.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-collector
  namespace: analytics                 # ← not url-shortener
  labels:
    app.kubernetes.io/name: analytics-collector
    app.kubernetes.io/instance: analytics-collector
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Analytics event collector owned by another team (stand-in)"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "cross-namespace-dependency"
spec:
  replicas: 1                          # counts live in memory; see application/collector/app.py
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-collector
      app.kubernetes.io/instance: analytics-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-collector
        app.kubernetes.io/instance: analytics-collector
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: analytics
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: analytics-collector
          image: cloudprakhargupta/url-shortener:collector-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
