# 03-deployments/shortener-web-deployment.yaml
# WHY: The UI tier. It serves the page and proxies /api and /r to the API
#      server-side — which makes it an in-cluster client of `shortener-api`,
#      addressed by name, just like the API is a client of `postgres`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-web
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: shortener-web
    app.kubernetes.io/instance: shortener-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shortener UI — serves the page, proxies /api and /r to the API"
    lab.k8s-project/stage: "03-deployments"
    lab.k8s-project/teaches: "deployment,dns-dependency"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener-web
      app.kubernetes.io/instance: shortener-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener-web
        app.kubernetes.io/instance: shortener-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: url-shortener
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: shortener-web
          image: cloudprakhargupta/url-shortener:web-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SHORTENER_API_URL           # a name nothing answers to — yet
              value: "http://shortener-api:8080"
            - name: APP_ENV
              value: "lab"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
