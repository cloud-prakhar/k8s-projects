# 04-services/analytics-collector-service.yaml
# WHY: The analytics team exposes their collector the normal way — a ClusterIP
#      Service in THEIR namespace. Its DNS name is
#      `analytics-collector.analytics.svc.cluster.local`. Note what that name
#      does NOT resolve as from inside `url-shortener`: plain `analytics-collector`
#      — the search path only completes names in the caller's own namespace.
apiVersion: v1
kind: Service
metadata:
  name: analytics-collector
  namespace: analytics
  labels:
    app.kubernetes.io/name: analytics-collector
    app.kubernetes.io/instance: analytics-collector
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "The analytics team's collector endpoint"
    lab.k8s-project/stage: "04-services"
    lab.k8s-project/teaches: "clusterip,cross-namespace-dns"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: analytics-collector
    app.kubernetes.io/instance: analytics-collector
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
