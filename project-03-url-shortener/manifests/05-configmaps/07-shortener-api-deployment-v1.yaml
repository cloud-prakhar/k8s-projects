# 05-configmaps/07-shortener-api-deployment-v1.yaml
# WHAT CHANGED vs 03-shortener-api-deployment.yaml:
#   envFrom references `shortener-config-v1` (immutable) instead of the mutable
#   `shortener-config`. That one-word edit is a pod-template change, so applying
#   it IS a rolling update — the whole fleet moves to v1 together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-api
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: shortener-api
    app.kubernetes.io/instance: shortener-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Shortener API — configuration from immutable ConfigMap v1"
    lab.k8s-project/stage: "05-configmaps"
    lab.k8s-project/teaches: "immutable-configmap,rollout-on-change"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener-api
      app.kubernetes.io/instance: shortener-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener-api
        app.kubernetes.io/instance: shortener-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: url-shortener
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: shortener-api
          image: cloudprakhargupta/url-shortener:api-1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shortener-config-v1   # ← the version is part of the name
          env:
            - name: POSTGRES_PASSWORD           # ⚠️ still plaintext — stage 06
              value: "dev-password-not-for-production"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
