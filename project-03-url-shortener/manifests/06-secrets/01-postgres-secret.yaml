# 06-secrets/01-postgres-secret.yaml
# WHY: The database password was a literal in two Deployments, committed to Git
#      and readable by anyone with `kubectl get deployment -o yaml`. A Secret
#      holds it in a separate object with separate RBAC, is never printed by
#      `kubectl describe`, and is consumed by exactly the two workloads that
#      must agree on it: PostgreSQL (which creates the user) and the API (which
#      logs in as it).
#
# 🧪 DEMO: a Secret in Git is still a password in Git. base64 is ENCODING, not
#    encryption. On EKS the production answer is AWS Secrets Manager synced in
#    by the External Secrets Operator or the Secrets Store CSI Driver, with the
#    pod authorised through EKS Pod Identity — Project 10.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/instance: postgres-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL password — shared by the database and the API"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,secretkeyref,base64-is-not-encryption"
type: Opaque
# stringData takes plain text for convenience; the API server base64-encodes it
# into `data` on write. Read it back and you will only ever see `data`.
stringData:
  POSTGRES_PASSWORD: "dev-password-not-for-production"
