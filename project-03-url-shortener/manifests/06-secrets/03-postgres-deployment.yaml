# 06-secrets/03-postgres-deployment.yaml
# WHAT CHANGED vs 03-deployments/postgres-deployment.yaml:
#   1. POSTGRES_PASSWORD comes from Secret/postgres-secret.
#   2. POSTGRES_DB and POSTGRES_USER come from ConfigMap/shortener-config-v1 —
#      the database and the API now read them from the SAME object, so they
#      cannot disagree.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL — credentials from a Secret, names from the shared ConfigMap"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secretkeyref,configmapkeyref"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: url-shortener
        app.kubernetes.io/version: "17.5"
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: shortener-config-v1
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: shortener-config-v1
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
