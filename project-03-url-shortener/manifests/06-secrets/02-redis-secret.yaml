# 06-secrets/02-redis-secret.yaml
# WHY: Redis had no password at all — `protected-mode no` and any pod in the
#      cluster could `FLUSHALL` the cache and every click count. Redis gets its
#      own Secret, separate from PostgreSQL's: the web tier and the database
#      need neither, and each consumer should be granted only what it uses.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: redis-secret
    app.kubernetes.io/instance: redis-secret
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "Redis password — shared by Redis and the API"
    lab.k8s-project/stage: "06-secrets"
    lab.k8s-project/teaches: "secret,least-exposure"
type: Opaque
stringData:
  REDIS_PASSWORD: "dev-redis-password-not-for-production"
