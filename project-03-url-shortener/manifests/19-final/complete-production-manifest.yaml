# 19-final/complete-production-manifest.yaml
# ---------------------------------------------------------------------------
# THE COMPLETE DESIRED STATE of Project 03, in one file (plus the two
# ConfigMaps kustomization.yaml GENERATES from config/).
#
# ⚠️ Apply it through Kustomize — `kubectl apply -k manifests/19-final/`.
#    Applied with -f alone, every workload references ConfigMaps named
#    `shortener-config` / `redis-config` that do not exist, and pods sit in
#    CreateContainerConfigError.
#
# WHAT IS DELIBERATELY ABSENT — teaching artifacts:
#   • the mutable `shortener-config` and versioned -v1/-v2 ConfigMaps (stage 05/08)
#     — replaced by hash-named generated ConfigMaps
#   • `checksum/config` annotations — the generated name hash does that job now
#   • the stand-alone postgres-data / redis-data PVCs and the Deployment versions
#     of both datastores (stage 07) — the StatefulSets' claim templates own storage
#
# PREREQUISITES (cluster software, not this application):
#   • the aws-ebs-csi-driver add-on — or no PVC ever binds
#   • the AWS Load Balancer Controller + IngressClass `alb` — or no ALB appears
# ---------------------------------------------------------------------------
# --- Namespaces --------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: url-shortener
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "1.0.0"
    # ALB readiness gates: a pod is not Ready until its ALB target is healthy (stage 11)
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  annotations:
    kubernetes.io/description: "URL Shortener — web, API, PostgreSQL and Redis"
    lab.k8s-project/stage: "00-namespace"
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: analytics
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Another team's analytics platform — the shortener's external dependency"
    lab.k8s-project/stage: "00-namespace"
---
# --- Storage (cluster-scoped) ----------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: url-shortener-gp3
  labels:
    app.kubernetes.io/name: url-shortener-gp3
    app.kubernetes.io/instance: url-shortener-gp3
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Encrypted gp3 EBS volumes for the shortener's datastores"
    lab.k8s-project/stage: "07-storage"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
