# --- Ingress → ALB (stage 09) --------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener-ingress
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener-ingress
    app.kubernetes.io/instance: url-shortener-ingress
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "Internet-facing ALB: / to the UI, /api and /r to the API"
    lab.k8s-project/stage: "09-ingress"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=20
    # ⚠️ deploy.sh replaces this with your public IP /32 — an open URL shortener is an open redirector
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    alb.ingress.kubernetes.io/tags: project=url-shortener,managed-by=aws-load-balancer-controller
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shortener-api
                port:
                  number: 8080
          - path: /r
            pathType: Prefix
            backend:
              service:
                name: shortener-api
                port:
                  number: 8080
          - path: /
