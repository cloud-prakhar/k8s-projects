# --- network ---------------------------------------------------------------
# Listen on the pod IP. Redis's own default is loopback only, which would make
# it unreachable through any Service — silently.
bind 0.0.0.0
port 6379
# A password is always set by the start-up script (from Secret/redis-secret),
# so protected mode has nothing left to protect against.
protected-mode no

# --- persistence -------------------------------------------------------------
dir /data
appendonly yes
appendfsync everysec

# --- memory ------------------------------------------------------------------
# Keep BELOW the container memory limit (256Mi) or the kernel OOM-kills Redis
# before Redis gets a chance to evict.
maxmemory 100mb
# Evict only keys with a TTL (cached links); never the click counters.
maxmemory-policy volatile-lru
