# 07-storage/03-redis-data-pvc.yaml
# WHY: Deleting the Redis pod reset every click counter to zero. The cache
#      entries rebuild themselves from PostgreSQL; the counters have no other
#      copy. Redis already writes an append-only file — it just needs a /data
#      directory that survives the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "8.2.9"
  annotations:
    kubernetes.io/description: "Durable /data for Redis's append-only file (single-pod claim)"
    lab.k8s-project/stage: "07-storage"
    lab.k8s-project/teaches: "pvc,ebs,aof-persistence"
spec:
  storageClassName: url-shortener-gp3
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
