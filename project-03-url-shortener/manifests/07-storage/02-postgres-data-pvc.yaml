# 07-storage/02-postgres-data-pvc.yaml
# WHY: Deleting the PostgreSQL pod deleted every short link, because the data
#      directory lived in the container's own writable layer. This claim asks
#      for a disk that outlives any pod that mounts it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "Durable data directory for PostgreSQL (single-pod claim)"
    lab.k8s-project/stage: "07-storage"
    lab.k8s-project/teaches: "pvc,ebs,readwriteonce"
spec:
  storageClassName: url-shortener-gp3
  accessModes:
    # ReadWriteOnce = one NODE may mount it read-write. That is all an EBS volume
    # can do: it attaches to exactly one EC2 instance at a time.
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi                     # the smallest gp3 volume; ~$0.08/month
