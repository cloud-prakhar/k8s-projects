# 07-storage/04-postgres-deployment.yaml
# WHAT CHANGED vs 06-secrets/03-postgres-deployment.yaml:
#   1. The data directory is on PVC/postgres-data — an EBS volume.
#   2. PGDATA is a SUBDIRECTORY of the mount. A fresh ext4 filesystem contains
#      `lost+found`, and initdb refuses to initialise a non-empty directory.
#   3. strategy: Recreate. The default RollingUpdate starts the NEW pod before
#      stopping the old one. If the scheduler puts it on another node, it waits
#      for an EBS volume that is still attached elsewhere — `Multi-Attach error`
#      — and the rollout deadlocks. Recreate stops the old pod first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: url-shortener
    app.kubernetes.io/version: "17.5"
  annotations:
    kubernetes.io/description: "PostgreSQL — data directory on an EBS-backed PVC"
    lab.k8s-project/stage: "07-storage"
    lab.k8s-project/teaches: "pvc-mount,pgdata-subdir,recreate-strategy"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: url-shortener
        app.kubernetes.io/version: "17.5"
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: shortener-config-v1
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: shortener-config-v1
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data   # the pod names a CLAIM, never a disk
